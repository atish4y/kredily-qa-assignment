[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --html=report.html --self-contained-html
markers =
    smoke: Smoke tests for critical user journeys
    login: Authentication test cases
    dashboard: Dashboard workflow tests
    attendance: Attendance and punch tests
    leave: Leave balance and request tests
